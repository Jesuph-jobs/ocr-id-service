[project]
name = "algerian-id-ocr"
version = "0.1.0"
description = "Self-hosted CPU-only OCR worker for Algerian identity documents."
readme = "README.md"
authors = [{ name = "Youcef Jesuph" }]
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "bullmq>=3.0.4",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rapidfuzz>=3.10.0",
    "redis>=7.4.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
